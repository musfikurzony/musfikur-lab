# ============================================================================
# CLOUDFLARE PAGES CONFIGURATION
# ============================================================================
#
# This project deploys as PURE STATIC FILES. There is no Worker, no
# serverless function and no server-side rendering.
#
# `npm run build` writes plain HTML/CSS/JS into ./out and Cloudflare serves
# that folder straight from the edge.
#
# ----------------------------------------------------------------------------
# WHAT MUST NOT BE ADDED
# ----------------------------------------------------------------------------
#
# Anything below would require a Worker or SSR and will break this deployment
# model. `output: 'export'` in next.config.ts makes most of them fail the build
# rather than fail silently in production — that is deliberate:
#
#   • Route Handlers            app/**/route.ts
#   • Server Actions            'use server'
#   • Middleware                middleware.ts
#   • Dynamic params without    generateStaticParams()
#   • ISR / revalidate          export const revalidate = 60
#   • Runtime cookies/headers   cookies(), headers()
#   • next/image optimisation   (already disabled — we ship pre-sized WebP)
#
# If one of those is ever genuinely needed, that is a deliberate architecture
# change to discuss first, not something to work around here.
#
# ----------------------------------------------------------------------------
# NOTE ON WRANGLER VERSIONS
# ----------------------------------------------------------------------------
#
# `pages_build_output_dir` needs Wrangler 3.45 or newer. The version pinned in
# package.json satisfies this. If you ever run a much older global wrangler,
# use the explicit command instead:  wrangler pages deploy out
# ============================================================================

name = "musfikur-lab"
compatibility_date = "2026-09-04"

# The folder `npm run build` produces. This is what gets uploaded.
pages_build_output_dir = "out"

# ----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# ----------------------------------------------------------------------------
#
# Deliberately NOT set here. wrangler.toml is committed to Git, and secrets in
# a committed file are not secrets.
#
# The private Library's Supabase keys go in the Cloudflare dashboard under
# Workers & Pages → your project → Settings → Variables and Secrets, and in a
# local `.env.local` for development. See .env.example.
#
# The site builds and deploys correctly with none of them set; the Library
# simply reports that it is not yet activated.
